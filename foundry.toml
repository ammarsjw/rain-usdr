[profile.default]
src = "contracts"
test = "tests"
out = "out"
libs = ["lib", "node_modules"]
auto_detect_remappings = true
cache_path = "cache_forge"
solc = "0.8.30"
optimizer = true
optimizer_runs = 1000000
evm_version = "cancun"
via_ir = true

[profile.testing]
eth_rpc_url = "testing"

[rpc_endpoints]
testing = "${URL_PRODUCTION}"

[etherscan]
testing = { key = "${ETHERSCAN_API_KEY}" }

[lint]
lint_on_build = false
